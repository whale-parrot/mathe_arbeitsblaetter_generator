name: Build Desktop Apps

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write


jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: math-worksheets-linux
            artifact_path: dist/math-worksheets-linux
      
          - os: windows-latest
            artifact_name: math-worksheets-windows
            artifact_path: dist/math-worksheets-windows.exe
      
          - os: macos-latest
            artifact_name: math-worksheets-macos
            artifact_path: dist/math-worksheets-macos.app
    
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install streamlit reportlab svglib PyMuPDF pyinstaller

      - name: Build with PyInstaller
        run: python build.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          retention-days: 5

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/math-worksheets-linux/math-worksheets-linux
            artifacts/math-worksheets-windows/math-worksheets-windows.exe
            artifacts/math-worksheets-macos/math-worksheets-macos.app
          body: |
            ## Download
            
            - **Windows:** `math-worksheets-windows.exe`
            - **macOS:** `math-worksheets-macos.app` (right-click → Open)
            - **Linux:** `math-worksheets-linux`
            
            ## How to Run
            
            **Windows:** Double-click the `.exe` file. If Windows Defender warns you, click "More info" → "Run anyway".
            
            **macOS:** Right-click the file → Open → Open. This bypasses the "unidentified developer" warning.
            
            **Linux:** Open terminal, navigate to the download folder, run `chmod +x math-worksheets-linux` then `./math-worksheets-linux`.
          draft: false
          prerelease: false
